[project]
name = "nfl-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "hdbscan>=0.8.44",
    "nflreadpy>=0.1.5",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.0",
    "typer>=0.27.3",
    "umap-learn>=0.5.12",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
